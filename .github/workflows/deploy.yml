name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e

            echo "🚀 Starting deployment..."

            # Load NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Navigate to project directory
            cd ~/LOS-Academy-server || exit 1

            # Fetch latest changes
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies
            echo "📦 Installing dependencies..."
            export CI=true
            npm ci --no-audit --no-fund

            # Run tests (if applicable)
            # echo "🧪 Running tests..."
            # npm test

            # Build the project
            echo "🔨 Building project..."
            npm run build

            # Install/update the daily database backup cron job
            if ! command -v pg_dump >/dev/null || ! command -v crontab >/dev/null; then
              SUDO=""
              [ "$(id -u)" -eq 0 ] || SUDO="sudo"
              $SUDO apt-get update
              $SUDO apt-get install -y postgresql-client cron
            fi
            mkdir -p backups
            PROJECT_DIR="$HOME/LOS-Academy-server"
            NODE_BIN="$(command -v node)"
            PG_BIN="$(dirname "$(command -v pg_dump)")"
            BACKUP_CRON="0 2 * * * cd $PROJECT_DIR && PATH=$PG_BIN:/usr/bin:/bin $NODE_BIN scripts/database.mjs backup > backups/database-backup.log 2>&1 && find backups -type f -name 'database-*.dump' -mtime +30 -delete"
            CURRENT_CRONTAB="$(crontab -l 2>/dev/null || true)"
            {
              printf '%s\n' "$CURRENT_CRONTAB" | grep -vF 'scripts/database.mjs backup' || true
              printf '%s\n' "$BACKUP_CRON"
            } | crontab -
            echo "💾 Daily database backup scheduled for 02:00 server time"

            # Restart PM2 application
            echo "♻️ Restarting application..."
            pm2 restart backend --update-env

            # Save PM2 process list
            pm2 save

            # Health check
            echo "🏥 Performing health check..."
            sleep 5
            pm2 status backend

            echo "✅ Deployment completed successfully!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed! Check the logs above for details."
