name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e

            echo "🚀 Starting deployment..."

            # Navigate to project directory
            cd ~/LOS-Academy-server || exit 1

            # Fetch latest changes
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Build and restart Docker container
            echo "🔨 Building Docker image..."
            docker build -t los-academy-server:latest .

            echo "♻️ Replacing application container..."
            pm2 stop backend || true
            pm2 delete backend || true
            docker rm -f backend || true
            docker run -d \
              --name backend \
              --restart unless-stopped \
              --env-file .env \
              -e NODE_ENV=production \
              -p 8080:8080 \
              los-academy-server:latest

            # Health check
            echo "🏥 Performing health check..."
            sleep 5
            test "$(docker inspect -f '{{.State.Running}}' backend)" = "true"
            docker logs --tail 80 backend

            echo "✅ Deployment completed successfully!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed! Check the logs above for details."
