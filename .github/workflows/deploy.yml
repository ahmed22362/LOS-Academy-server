name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e  # ❗ Abort on ANY error

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ~/LOS-Academy-server

            echo "🔍 Checking git status..."
            if ! git diff --quiet; then
              echo "❌ ERROR: Local changes detected on VPS. Deployment aborted."
              echo "You must commit, stash, or discard changes on the VPS."
              exit 1
            fi

            echo "⬇️ Pulling latest changes..."
            git pull origin main || {
              echo "❌ ERROR: Git pull failed (merge conflict or outdated branch)."
              exit 1
            }

            echo "📦 Installing packages..."
            npm install || {
              echo "❌ ERROR: npm install failed."
              exit 1
            }

            echo "🔨 Building project..."
            npm run build || {
              echo "❌ ERROR: npm run build failed."
              exit 1
            }

            echo "🚀 Restarting server..."
            pm2 restart backend || {
              echo "❌ ERROR: PM2 restart failed."
              exit 1
            }

            echo "✅ Deployment completed successfully!"
